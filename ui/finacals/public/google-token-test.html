<!DOCTYPE html>
<html>
<head>
  <title>Get Google ID Token (Test)</title>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }
    .config-box {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 15px;
    }
    #tokenBox {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      font-size: 13px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #buttonContainer {
      margin-top: 15px;
      min-height: 40px;
    }
  </style>
</head>
<body>

  <h2>Google ID Token Generator (for testing)</h2>
  <p>Select the Client ID target → Sign in with Google → Copy the generated ID Token</p>

  <div class="config-box">
    <label for="clientIdSelect">Select Target Google Client ID:</label>
    <select id="clientIdSelect" onchange="initGoogleSignIn()">
      <option value="14562504972-oj35nhqai92dfkdkbrems7rrsvg50mgq.apps.googleusercontent.com">
        Primary Client ID (Mobile/Default Backend Environment)
      </option>
      <option value="14562504972-dg8h7p03cj0dkimkhpuenhvstrcctks4.apps.googleusercontent.com">
        Firebase Web Client ID (New Environment Audience)
      </option>
    </select>
  </div>

  <!-- Container where the Google Sign-In button will be dynamically rendered -->
  <div id="buttonContainer"></div>

  <h3>Your Google ID Token:</h3>
  <textarea id="tokenBox" readonly placeholder="Token will appear here after login..."></textarea>
  <br>
  <button onclick="copyToken()">Copy Token</button>

  <script>
    // Initialize Google API initialization logic after the library loads
    window.onload = function () {
      initGoogleSignIn();
    };

    function initGoogleSignIn() {
      const selectedClientId = document.getElementById("clientIdSelect").value;
      const buttonContainer = document.getElementById("buttonContainer");
      
      // Clear previous button elements to reset registration state safely
      buttonContainer.innerHTML = "";

      // Initialize the Google client programmatically with the active option configuration
      google.accounts.id.initialize({
        client_id: selectedClientId,
        callback: handleCredentialResponse,
        auto_prompt: false
      });

      // Render the button inside our dedicated node
      google.accounts.id.renderButton(
        buttonContainer,
        { 
          type: "standard", 
          size: "large", 
          theme: "outline", 
          text: "sign_in_with", 
          shape: "rectangular", 
          logo_alignment: "left" 
        }
      );
      
      // Clear out older context inputs when toggling environments
      document.getElementById("tokenBox").value = "";
    }

    function handleCredentialResponse(response) {
      // Expose the response JWT to the interface box
      document.getElementById("tokenBox").value = response.credential;
      console.log("ID Token successfully generated for selected Client ID target.");
    }

    function copyToken() {
      const tokenBox = document.getElementById("tokenBox");
      if (!tokenBox.value) {
        alert("Please generate a token first by signing in!");
        return;
      }
      tokenBox.select();
      document.execCommand("copy");
      alert("Token successfully copied to clipboard!");
    }
  </script>

</body>
</html>
